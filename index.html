<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd84d">
<title>マジカルバナナマップ</title>
<meta name="description" content="〇〇といえば△△。東京の街と「といえば」をつなぐマップ。">
<style>
  :root {
    --bg: #fffaf0;
    --ink: #2b2620;
    --muted: #7a6f60;
    --banana: #ffd84d;
    --banana-deep: #f2b705;
    --land: #f6efdf;
    --land-line: #e3d7bd;
    --water: #bfe3f2;
    --river: #8ccbe6;
    --yamanote: #9acd32;
    --card: #ffffff;
    --shadow: 0 6px 24px rgba(60, 45, 10, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--banana);
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  header p { margin: 4px 0 0; font-size: 13px; color: #5a4a10; }

  .map-wrap { position: relative; }
  .map-scroll {
    overflow: auto;
    height: 62vh;
    min-height: 340px;
    background: var(--water);
    touch-action: pan-x pan-y;
    -webkit-overflow-scrolling: touch;
  }
  #map { display: block; }
  .zoom {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .zoom button, .quiz-btn {
    border: 0; background: var(--card); color: var(--ink);
    box-shadow: var(--shadow); font: inherit; cursor: pointer;
  }
  .zoom button { width: 44px; height: 44px; border-radius: 50%; font-size: 22px; line-height: 1; }
  .quiz-btn {
    position: absolute; left: 12px; bottom: 12px;
    height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 700;
    background: var(--banana);
  }

  .pin { cursor: pointer; }
  .pin circle { fill: #fff; stroke: var(--banana-deep); stroke-width: 3; }
  .pin.active circle { fill: var(--banana); stroke: var(--ink); }
  .pin .emoji { font-size: 26px; text-anchor: middle; dominant-baseline: central; }
  .pin .label {
    font-size: 15px; font-weight: 700; text-anchor: middle;
    paint-order: stroke; stroke: #fff; stroke-width: 4px; fill: var(--ink);
  }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 24px rgba(60, 45, 10, .2);
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform .25s ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: #ddd; margin: 0 auto 12px; }
  .sheet .close {
    position: absolute; top: 10px; right: 12px; width: 36px; height: 36px;
    border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer;
  }
  .phrase { font-size: 15px; color: var(--muted); margin: 0; }
  .phrase strong { color: var(--ink); font-size: 20px; }
  .answer { font-size: 30px; font-weight: 800; margin: 6px 0 8px; }
  .answer .em { margin-right: 6px; }
  .note { margin: 0; font-size: 14px; line-height: 1.6; }
  .reveal {
    margin-top: 10px; width: 100%; height: 48px; border: 0; border-radius: 12px;
    background: var(--banana); font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .hidden { display: none !important; }

  main { padding: 20px 16px 32px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .search {
    width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--land-line);
    padding: 0 14px; font: inherit; font-size: 16px; background: #fff; margin-bottom: 12px;
  }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .list button {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border: 0; border-radius: 14px; background: #fff;
    box-shadow: 0 1px 4px rgba(60, 45, 10, .08); font: inherit; text-align: left; cursor: pointer; color: inherit;
  }
  .list .em { font-size: 26px; width: 32px; text-align: center; }
  .list .area { font-weight: 700; }
  .list .kw { color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 24px; }
</style>
</head>
<body>

<header>
  <h1>🍌 マジカルバナナマップ</h1>
  <p>〇〇といえば△△。東京の街の「といえば」マップ</p>
</header>

<div class="map-wrap">
  <div class="map-scroll" id="mapScroll">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="東京の地図"></svg>
  </div>
  <button class="quiz-btn" id="quizBtn" type="button">🎲 〜といえば？</button>
  <div class="zoom">
    <button type="button" id="zoomIn" aria-label="拡大">＋</button>
    <button type="button" id="zoomOut" aria-label="縮小">－</button>
  </div>
</div>

<main>
  <h2>といえばリスト</h2>
  <input class="search" id="search" type="search" placeholder="街やキーワードでさがす（例：カレー）">
  <ul class="list" id="list"></ul>
  <p class="empty hidden" id="empty">見つかりませんでした</p>
</main>

<footer>位置はだいたいです。地図は雰囲気の略図です。</footer>

<div class="sheet" id="sheet" aria-live="polite">
  <div class="grip"></div>
  <button class="close" id="closeSheet" type="button" aria-label="閉じる">×</button>
  <p class="phrase"><strong id="sheetArea"></strong> といえば…</p>
  <p class="answer" id="sheetAnswer"><span class="em" id="sheetEmoji"></span><span id="sheetKeyword"></span></p>
  <p class="note" id="sheetNote"></p>
  <button class="reveal hidden" id="revealBtn" type="button">答えを見る</button>
</div>

<script>
// ここに追加すれば地図とリストに出ます。lat/lng はだいたいでOK。
const SPOTS = [
  { area: "亀戸",   keyword: "ホルモン",       emoji: "🥩", lat: 35.6974, lng: 139.8263, note: "亀戸ホルモンをはじめ焼肉・ホルモンの名店が並ぶ。" },
  { area: "下北沢", keyword: "カレー",         emoji: "🍛", lat: 35.6613, lng: 139.6680, note: "スパイスカレーの激戦区。毎年カレーフェスも開催。" },
  { area: "神保町", keyword: "出版社・古本",   emoji: "📚", lat: 35.6959, lng: 139.7577, note: "東京のど真ん中。出版社と古書店がぎっしり集まるエリア。" },
  { area: "秋葉原", keyword: "電気街・アニメ", emoji: "🎮", lat: 35.6984, lng: 139.7731, note: "家電、PCパーツ、アニメ、メイドカフェ。" },
  { area: "月島",   keyword: "もんじゃ焼き",   emoji: "🍳", lat: 35.6640, lng: 139.7820, note: "もんじゃストリートに70軒以上のお店。" },
  { area: "巣鴨",   keyword: "おばあちゃんの原宿", emoji: "👵", lat: 35.7334, lng: 139.7393, note: "とげぬき地蔵と地蔵通り商店街。赤パンツも有名。" },
  { area: "新大久保", keyword: "韓国グルメ",   emoji: "🇰🇷", lat: 35.7013, lng: 139.7000, note: "チーズハットグ、韓国コスメ、K-POPグッズ。" },
  { area: "原宿",   keyword: "クレープ",       emoji: "🍓", lat: 35.6702, lng: 139.7027, note: "竹下通りで食べ歩き。カワイイ文化の発信地。" },
  { area: "浅草",   keyword: "雷門",           emoji: "🏮", lat: 35.7111, lng: 139.7964, note: "浅草寺の大ちょうちん。人形焼きも。" },
  { area: "築地",   keyword: "海鮮",           emoji: "🐟", lat: 35.6654, lng: 139.7707, note: "市場は移転したけど、場外市場はいまも元気。" },
  { area: "高円寺", keyword: "古着",           emoji: "👕", lat: 35.7052, lng: 139.6496, note: "古着屋とライブハウス、阿波おどり。" },
  { area: "中野",   keyword: "サブカル",       emoji: "🤖", lat: 35.7074, lng: 139.6659, note: "中野ブロードウェイはサブカルの聖地。" },
  { area: "荻窪",   keyword: "ラーメン",       emoji: "🍜", lat: 35.7046, lng: 139.6200, note: "東京ラーメンの老舗が多い「荻窪ラーメン」。" },
  { area: "上野",   keyword: "パンダ",         emoji: "🐼", lat: 35.7141, lng: 139.7741, note: "上野動物園のパンダ。美術館や博物館も。" },
  { area: "合羽橋", keyword: "調理道具",       emoji: "🔪", lat: 35.7140, lng: 139.7878, note: "包丁から食品サンプルまで揃う道具街。" },
  { area: "両国",   keyword: "相撲",           emoji: "🤼", lat: 35.6962, lng: 139.7934, note: "国技館とちゃんこ鍋の街。" },
  { area: "新橋",   keyword: "サラリーマン",   emoji: "👔", lat: 35.6662, lng: 139.7584, note: "SL広場のインタビューでおなじみ。ガード下で一杯。" },
  { area: "赤羽",   keyword: "せんべろ",       emoji: "🍺", lat: 35.7780, lng: 139.7210, note: "朝から飲める店もある、呑んべえの聖地。" },
  { area: "北千住", keyword: "飲み屋街",       emoji: "🏮", lat: 35.7497, lng: 139.8049, note: "宿場町の名残がある路地に飲み屋がずらり。" },
  { area: "蒲田",   keyword: "羽根つき餃子",   emoji: "🥟", lat: 35.5625, lng: 139.7161, note: "パリパリの羽根つき餃子発祥の地。" },
  { area: "西葛西", keyword: "リトルインディア", emoji: "🇮🇳", lat: 35.6644, lng: 139.8593, note: "インド出身の人が多く住み、本格インド料理店が多い。" },
  { area: "柴又",   keyword: "寅さん",         emoji: "🎩", lat: 35.7584, lng: 139.8771, note: "「男はつらいよ」の舞台。帝釈天と草だんご。" },
  { area: "戸越銀座", keyword: "商店街",       emoji: "🛍️", lat: 35.6158, lng: 139.7145, note: "全長1.3km、東京屈指の長い商店街。" },
  { area: "自由が丘", keyword: "スイーツ",     emoji: "🍰", lat: 35.6077, lng: 139.6687, note: "パティスリーが集まるスイーツの街。" },
  { area: "渋谷",   keyword: "スクランブル交差点", emoji: "🚦", lat: 35.6595, lng: 139.7005, note: "ハチ公前の大交差点。ハロウィンも有名。" },
  { area: "吉祥寺", keyword: "住みたい街",     emoji: "🏡", lat: 35.7033, lng: 139.5797, note: "井の頭公園と商店街。住みたい街ランキング常連。" },
];

// ---- 地図の投影（だいたいの正距円筒） ----
const BOUNDS = { west: 139.555, east: 139.905, south: 35.545, north: 35.795 };
const KX = Math.cos(35.68 * Math.PI / 180);
const W = 1000;
const H = Math.round(W * (BOUNDS.north - BOUNDS.south) / ((BOUNDS.east - BOUNDS.west) * KX));
const proj = (lat, lng) => [
  (lng - BOUNDS.west) / (BOUNDS.east - BOUNDS.west) * W,
  (BOUNDS.north - lat) / (BOUNDS.north - BOUNDS.south) * H,
];
const path = (pts, close) =>
  pts.map(([lat, lng], i) => (i ? "L" : "M") + proj(lat, lng).map(n => n.toFixed(1)).join(",")).join(" ") + (close ? " Z" : "");

// 東京湾（ざっくり）
const BAY = [
  [35.662, 139.905], [35.650, 139.880], [35.648, 139.845], [35.640, 139.815], [35.643, 139.790],
  [35.650, 139.775], [35.648, 139.762], [35.640, 139.755], [35.625, 139.752], [35.605, 139.748],
  [35.585, 139.750], [35.565, 139.757], [35.545, 139.770], [35.540, 139.770], [35.540, 139.910],
];
const SUMIDA = [
  [35.780, 139.718], [35.770, 139.745], [35.757, 139.768], [35.747, 139.792], [35.730, 139.802],
  [35.712, 139.799], [35.698, 139.793], [35.683, 139.790], [35.668, 139.785], [35.652, 139.778],
];
const ARAKAWA = [
  [35.790, 139.700], [35.778, 139.735], [35.768, 139.770], [35.760, 139.805], [35.742, 139.825],
  [35.715, 139.837], [35.690, 139.845], [35.665, 139.855], [35.648, 139.858],
];
const TAMA = [
  [35.640, 139.555], [35.620, 139.620], [35.600, 139.665], [35.580, 139.695], [35.565, 139.718], [35.548, 139.755],
];
const YAMANOTE = [
  [35.681,139.767],[35.675,139.763],[35.666,139.758],[35.655,139.757],[35.646,139.748],[35.628,139.739],
  [35.620,139.728],[35.626,139.724],[35.634,139.716],[35.647,139.710],[35.658,139.702],[35.670,139.703],
  [35.683,139.702],[35.690,139.700],[35.701,139.700],[35.713,139.704],[35.721,139.706],[35.730,139.711],
  [35.732,139.729],[35.733,139.739],[35.737,139.747],[35.738,139.761],[35.732,139.767],[35.728,139.771],
  [35.721,139.778],[35.714,139.777],[35.707,139.775],[35.698,139.774],[35.692,139.771],
];

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

const svg = document.getElementById("map");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
el("rect", { x: 0, y: 0, width: W, height: H, fill: "var(--land)" }, svg);
el("path", { d: path(BAY, true), fill: "var(--water)" }, svg);
el("path", { d: path(TAMA), fill: "none", stroke: "var(--river)", "stroke-width": 14, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
el("path", { d: path(ARAKAWA), fill: "none", stroke: "var(--river)", "stroke-width": 12, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
el("path", { d: path(SUMIDA), fill: "none", stroke: "var(--river)", "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
el("path", { d: path(YAMANOTE, true), fill: "none", stroke: "var(--yamanote)", "stroke-width": 5, "stroke-dasharray": "14 8", opacity: .8 }, svg);

const labelAt = (text, lat, lng, size) => {
  const [x, y] = proj(lat, lng);
  const t = el("text", { x, y, "font-size": size, fill: "#5d93ad", "text-anchor": "middle", "font-weight": 700, opacity: .9 }, svg);
  t.textContent = text;
};
labelAt("東京湾", 35.590, 139.835, 30);
labelAt("山手線", 35.645, 139.728, 15);

const pinLayer = el("g", {}, svg);
const pins = SPOTS.map((s, i) => {
  const [x, y] = proj(s.lat, s.lng);
  const outer = el("g", { transform: `translate(${x},${y})` }, pinLayer);
  const g = el("g", { class: "pin", tabindex: 0, role: "button", "aria-label": `${s.area}といえば${s.keyword}` }, outer);
  el("circle", { r: 22 }, g);
  const em = el("text", { class: "emoji", y: 1 }, g);
  em.textContent = s.emoji;
  const lb = el("text", { class: "label", y: 40 }, g);
  lb.textContent = s.area;
  const open = () => showSpot(i);
  g.addEventListener("click", open);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  return g;
});

// ---- ズーム ----
const scroller = document.getElementById("mapScroll");
let zoom = 1;
function applyZoom(next, cx, cy) {
  const vw = scroller.clientWidth, vh = scroller.clientHeight;
  const fx = cx ?? (scroller.scrollLeft + vw / 2) / (vw * zoom);
  const fy = cy ?? (scroller.scrollTop + vh / 2) / (vw * zoom * H / W);
  zoom = Math.min(4, Math.max(1, next));
  const w = vw * zoom;
  svg.style.width = w + "px";
  svg.style.height = (w * H / W) + "px";
  // 拡大してもピンの見た目サイズはほぼ一定に
  const s = Math.max(.55, 1.6 / zoom);
  pins.forEach(p => p.setAttribute("transform", `scale(${s})`));
  scroller.scrollLeft = fx * w - vw / 2;
  scroller.scrollTop = fy * (w * H / W) - vh / 2;
}
document.getElementById("zoomIn").onclick = () => applyZoom(zoom * 1.4);
document.getElementById("zoomOut").onclick = () => applyZoom(zoom / 1.4);
window.addEventListener("resize", () => applyZoom(zoom));
// 最初は都心寄りに少し拡大
const [cx0, cy0] = proj(35.69, 139.74);
applyZoom(2.6, cx0 / W, cy0 / H);

function focusSpot(s) {
  const [x, y] = proj(s.lat, s.lng);
  if (zoom < 2.6) applyZoom(2.6, x / W, y / H);
  const w = scroller.clientWidth * zoom;
  scroller.scrollTo({
    left: x / W * w - scroller.clientWidth / 2,
    top: y / H * (w * H / W) - scroller.clientHeight / 2.6,
    behavior: "smooth",
  });
}

// ---- シート ----
const sheet = document.getElementById("sheet");
const $ = id => document.getElementById(id);
function showSpot(i, quiz = false) {
  const s = SPOTS[i];
  pins.forEach((p, j) => p.classList.toggle("active", j === i));
  pinLayer.appendChild(pins[i].parentNode); // 前面に
  $("sheetArea").textContent = s.area;
  $("sheetEmoji").textContent = s.emoji;
  $("sheetKeyword").textContent = s.keyword;
  $("sheetNote").textContent = s.note || "";
  $("sheetAnswer").classList.toggle("hidden", quiz);
  $("sheetNote").classList.toggle("hidden", quiz);
  $("revealBtn").classList.toggle("hidden", !quiz);
  sheet.classList.add("open");
  focusSpot(s);
}
$("revealBtn").onclick = () => {
  $("sheetAnswer").classList.remove("hidden");
  $("sheetNote").classList.remove("hidden");
  $("revealBtn").classList.add("hidden");
};
$("closeSheet").onclick = () => {
  sheet.classList.remove("open");
  pins.forEach(p => p.classList.remove("active"));
};
let last = -1;
$("quizBtn").onclick = () => {
  let i;
  do { i = Math.floor(Math.random() * SPOTS.length); } while (SPOTS.length > 1 && i === last);
  last = i;
  showSpot(i, true);
};

// ---- リスト ----
const list = $("list");
function renderList(q = "") {
  q = q.trim();
  list.innerHTML = "";
  const hits = SPOTS.map((s, i) => [s, i]).filter(([s]) =>
    !q || [s.area, s.keyword, s.note].some(t => (t || "").includes(q)));
  for (const [s, i] of hits) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="em"></span><span><span class="area"></span><br><span class="kw"></span></span>`;
    b.querySelector(".em").textContent = s.emoji;
    b.querySelector(".area").textContent = `${s.area}といえば`;
    b.querySelector(".kw").textContent = s.keyword;
    b.onclick = () => { window.scrollTo({ top: 0, behavior: "smooth" }); showSpot(i); };
    li.appendChild(b);
    list.appendChild(li);
  }
  $("empty").classList.toggle("hidden", hits.length > 0);
}
$("search").addEventListener("input", e => renderList(e.target.value));
renderList();
</script>
</body>
</html>
